<!doctype html><html lang="fi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#245b40"><link rel="manifest" href="/manifest.json"><title>Siskon parempi 15-peli</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#347d53,#153e2b);color:white;font:18px system-ui;min-height:100dvh}main{max-width:560px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:clamp(18px,4vw,26px)}button,select{font:inherit;border:0;border-radius:8px;padding:10px;background:#e0efdf;color:#173c29;cursor:pointer}#menu{position:absolute;right:12px;top:65px;background:#173e2b;padding:12px;border-radius:12px;z-index:10;box-shadow:0 6px 20px #0006}#menu button,#menu select{display:block;width:100%;margin:5px 0}#board{position:relative;aspect-ratio:1;background:#173e2b;border-radius:12px;touch-action:none;user-select:none;overflow:hidden}.tile{position:absolute;display:grid;place-items:center;border-radius:10px;color:#17362b;font-weight:800;font-size:clamp(22px,7vw,48px);transition:left .18s ease-out,top .18s ease-out;box-shadow:inset 0 2px 3px #fff6,0 2px 4px #0004;padding:0}.hint{outline:4px solid white;outline-offset:-5px;animation:pulse .7s alternate infinite}@keyframes pulse{to{filter:brightness(1.35)}}#stats{display:flex;justify-content:space-between;margin:12px 0}#status{min-height:60px;padding-top:12px}small{opacity:.65} [hidden]{display:none!important}</style><main><header><h1 id="title"></h1><button id="toggle" aria-label="Menu">☰</button></header><div id="menu" hidden><button id="new"></button><select id="size"><option>3</option><option selected>4</option><option>5</option></select><button id="undo"></button><button id="hint"></button><button id="analysis"></button><button id="auto"></button><select id="lang"><option value="fi">Suomi</option><option value="hu">Magyar</option><option valu const $=id=>document.getElementById(id),D={fi:['Siskon parempi 15-peli','Uusi peli','Peru','Vihje','Analyysi','Automaattinen ratkaisu','Pysäytä','Siirrot','Ratkaistu!','Siirrä laattaa','Ratkaisureitin siirtoja jäljellä'],en:['Sisko’s better 15 puzzle','New game','Undo','Hint','Analysis','Auto solve','Stop','Moves','Solved!','Move tile','Moves left on solution path'],hu:['Sisko jobb 15-ös játéka','Új játék','Visszavonás','Tipp','Elemzés','Automatikus megoldás','Leállítás','Lépések','Megoldva!','Mozgasd a csempét','Hátralévő lépések a megoldási úton']};let lang=localStorage.getItem('15lang')||'fi',n=4,b=[],route=[],history=[],moves=0,started=0,elapsed=0,timer=null;const t=()=>D[lang];function adjacent(i,j){return Math.abs(i%n-j%n)+Math.abs(Math.floor(i/n)-Math.floor(j/n))===1}function neighbors(i){return Array.from({length:n*n},(_,j)=>j).filter(j=>adjacent(i,j))}function swap(i,j){[b[i],b[j]]=[b[j],b[i]]}function solved(){return b.every((v,i)=>v===(i+1)%(n*n))}function fresh(){stop();b=Array.from({length:n*n},(_,i)=>(i+1)%(n*n));route=[];history=[];moves=0;started=0;elapsed=0;let prev=-1;for(let k=0;k<n*n*5;k++){let z=b.indexOf(0),opts=neighbors(z).filter(i=>i!==prev),i=opts[Math.floor(Math.random()*opts.length)];route.push(z);swap(i,z);prev=z}if(solved()){let z=b.indexOf(0);route.push(z);swap(neighbors(z)[0],z)}$('board').replaceChildren();for(let v=1;v<n*n;v++){let e=document.createElement('button');e.className='tile';e.textContent=v;e.dataset.v=v;e.style.background=['#f9e08b','#ffb45e','#ff805e','#8bd8bd','#8fc3ed','#c4a2ef'][Math.floor((v-1)/n)%6];e.onclick=()=>{if(!timer&&Date.now()>ignoreClick)slide(b.indexOf(v))};$('board').append(e)}$('status').textContent='';render();save()}function render(){for(let e of $('board').children){let i=b.indexOf(+e.dataset.v),w=100/n;e.style.width='calc('+w+'% - 8px)';e.style.height=e.style.width;e.style.left='calc('+(i%n*w)+'% + 4px)';e.style.top='calc('+(Math.floor(i/n)*w)+'% + 4px)';e.classList.remove('hint')}$('moves').textContent=t()[7]+': '+moves;clock()}function clock(){let s=Math.floor((elapsed+(started?Date.now()-started:0))/1000);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function save(){localStorage.setItem('15state',JSON.stringify({n,b,route,history,moves,elapsed:elapsed+(started?Date.now()-started:0)}))}function step(i){let z=b.indexOf(0);if(solved()||!adjacent(i,z))return;if(!started)started=Date.now();history.push({b:b.slice(),route:route.slice(),moves});if(route.at(-1)===i)route.pop();else route.push(z);swap(i,z);moves++;$('status').textContent='';if(solved()){elapsed+=Date.now()-started;started=0;stop();$('status').textContent=t()[8]}render();save()}function stop(){clearInterval(timer);timer=null;$('auto').textContent=t()[5]}function labels(){$('title').textContent=document.title=t()[0];['new','undo','hint','analysis','auto'].forEach((id,i)=>$(id).textContent=t()[i+1]);$('lang').value=lang;render()}$('toggle').onclick=()=>$('menu').hidden=!$('menu').hidden;function close(){$('menu').hidden=true}$('new').onclick=()=>{fresh();close()};$('size').onchange=()=>{n=+$('size').value;fresh();close()};$('lang').onchange=()=>{lang=$('lang').value;localStorage.setItem('15lang',lang);labels();close()};$('undo').onclick=()=>{stop();let h=history.pop();if(h){b=h.b;route=h.route;moves=h.moves;$('status').textContent='';render();save()}close()};$('hint').onclick=()=>{stop();close();let i=route.at(-1);if(i!==undefined&&!solved()){let v=b[i];$('board').querySelector('[data-v="'+v+'"]').classList.add('hint');$('status').textContent=t()[9]+' '+v}};$('analysis').onclick=()=>{close();$('status').textContent=t()[10]+': '+(solved()?0:route.length)};$('auto').onclick=()=>{close();if(timer){stop();return}if(solved())return;timer=setInterval(()=>{if(solved()||!route.length){stop();return}step(route.at(-1))},260);$('auto').textContent=t()[6]};let ignoreClick=0;function slide(i){let z=b.indexOf(0);if(i===z||solved())return;let d=Math.floor(i/n)===Math.floor(z/n)?Math.sign(i-z):i%n===z%n?Math.sign(i-z)*n:0;if(!d)return;while(z!==i){step(z+d);z+=d;if(solved())break}}let start=null;$('board').addEventListener('pointerdown',e=>{start=[e.clientX,e.clientY]});$('board').addEventListener('pointerup',e=>{if(!start||timer)return;let dx=e.clientX-start[0],dy=e.clientY-start[1];start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;ignoreClick=Date.now()+400;let d=Math.abs(dx)>Math.abs(dy)?(dx>0?1:-1):(dy>0?n:-n);let r=$('board').getBoundingClientRect(),x=Math.floor((e.clientX-dx-r.left)/r.width*n),y=Math.floor((e.clientY-dy-r.top)/r.height*n),i=y*n+x,z=b.indexOf(0);if(x>=0&&x<n&&y>=0&&y<n&&((Math.abs(d)===1&&Math.floor(z/n)===y)||(Math.abs(d)===n&&z%n===x))&&Math.sign(z-i)===Math.sign(d))slide(i);else direction(d);});function direction(d){let z=b.indexOf(0),i=z-d;if(i>=0&&i<b.length&&adjacent(i,z))step(i)}document.addEventListener('keydown',e=>{let d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-n,ArrowDown:n}[e.key];if(d&&!timer){e.preventDefault();direction(d)}});fresh();labels();setInterval(clock,250);if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');</script></html>
